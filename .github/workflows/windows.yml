name: Windows build and tests
on:
  push:
    branches: [main, service-preview, fix/control-service-routing, fix/service-identity-without-token, feat/password-access, fix/interactive-latency, fix/accelerated-control-capture]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      NOVOACESSO_OFFLINE: '1'
      DESK_AUTOREADY: '0'
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: 'C:\Windows\Fonts'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install --no-deps -e .
      - name: Test application
        run: python -m pytest tests -q --disable-warnings
      - name: Build and test service protocol without activation
        run: python native/DeskHost/build_service.py
      - name: Build public application without service credentials
        run: python scripts/build_windows.py
      - name: Test packaged application with synthetic data
        run: python scripts/validate_package.py
      - name: Build public unsigned installer
        run: python scripts/build_installer.py
      - name: Build service installer without activation
        run: python scripts/build_service_installer.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Desk-0.14.4-Windows-x64-unsigned
          path: dist/publish/*
          if-no-files-found: error
          retention-days: 30
